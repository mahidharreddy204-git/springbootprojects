spring.application.name=notification-service
server.port=8085


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true



spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group-v2
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.notification_service.dto.OrderPlacedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.notification_service.dto

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.com.example.notification_service=DEBUG